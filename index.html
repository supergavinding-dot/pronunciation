<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081426">
<title>英文教材</title>
<style>
:root{--ink:#eaf3ff;--line:#24415f;--muted:#91a9c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 50% -15%,#173d65 0%,#081426 58%) fixed;font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
header{padding:36px 4px 22px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:1px}
header p{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:2px}
.list{display:grid;gap:14px}
a.item{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;text-decoration:none;color:var(--ink);background:linear-gradient(145deg,#173858,#10233b);border:1px solid #285276;transition:transform .12s,box-shadow .15s,border-color .15s}
a.item:hover{border-color:#35d9ec;box-shadow:0 0 24px #21c7e633;transform:translateY(-2px)}
a.item:active{transform:scale(.98)}
.no{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#041322;background:linear-gradient(135deg,#087eaa,#19c4d8)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:22px}
.txt span{color:var(--muted);font-size:14px}
.go{font-size:26px;color:#35d9ec}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style></head>
<body><main>
<header><h1>📚 英文教材</h1><p>WORD MISSION · LEARN &amp; PLAY</p></header>

<a class="item" href="3.html"><div class="no">3</div><div class="txt"><b>一仟兩佰</b><span>1303 個單字・37 個分類</span></div><div class="go">›</div></a>
<a class="item" href="4.html"><div class="no">4</div><div class="txt"><b>GEPTKid</b><span>685 個單字・35 個分類</span></div><div class="go">›</div></a>
</div>
<footer>點選教材開始練習・聽讀／考試／訂正</footer>
</main></body></html>
