<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#081426">
<title>英文課本</title>
<style>
:root{--ink:#eaf3ff;--g:#16b8d4;--line:#24415f;--amber:#ffd166;--red:#ff647c;--muted:#91a9c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#173d65 0%,#081426 58%) fixed;color:var(--ink);font:16px/1.45 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
h1{font-size:19px;margin:0;flex:1;min-width:140px}
h1 small{display:block;font-size:11px;color:#8bb5d6;font-weight:500;letter-spacing:1.5px}
.hbtn{border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px;background:#10233b;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;text-decoration:none}
.hbtn:active{background:#173858}
#modes{display:flex;gap:6px;padding:0 12px 8px}
#modes button{flex:1;min-height:48px;font-size:15px;font-weight:600;border:1px solid var(--line);border-radius:12px;background:#10233b;color:var(--ink);cursor:pointer}
#modes button.on{background:linear-gradient(135deg,#087eaa,#19c4d8);color:#041322;border-color:#35d9ec;box-shadow:0 5px 22px #11b9d455}
.ctl{display:none;gap:8px;padding:0 12px 10px;align-items:center;flex-wrap:wrap}
.ctl.show{display:flex}
.ctl button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#10233b;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.ctl button.active{background:var(--amber);color:#152238;border-color:var(--amber)}
#actions{display:flex;gap:6px;padding:0 12px 8px}
#actions .hbtn{flex:1;justify-content:center;padding:0 4px;min-height:42px}
.opt{display:flex;align-items:center;gap:6px;padding:0 12px 8px}
.opt>span{flex:0 0 34px;font-size:12px;color:var(--muted)}
.opt button{flex:1;min-height:38px;border-radius:10px;border:1px solid var(--line);background:#10233b;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0 4px;white-space:nowrap}
.opt button.active{background:linear-gradient(135deg,#087eaa,#19c4d8);color:#041322;border-color:#35d9ec}
.opt.hide{display:none}
#extra-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 12px 10px}
#extra-tools label,#extra-tools button{min-height:38px;border:1px solid var(--line);border-radius:10px;background:#10233b;color:var(--ink);padding:0 12px;font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px}
#extra-tools button{cursor:pointer;font-weight:700}
#extra-tools input{width:18px;height:18px;accent-color:#16b8d4}
#progress-reset{display:none;margin-left:auto;color:var(--amber)!important}
#tabs button::after{content:' · 未讀';font-size:11px;opacity:.55}
#tabs button.done{background:linear-gradient(135deg,#0e594d,#147d68);border-color:#38d9a9;color:#f0fff9}
#tabs button.done::after{content:' ✓ 已讀';color:#b8ffe7;font-size:11px;font-weight:800;opacity:1}
.card .zh{display:none;font-size:calc(var(--fs)*.55);line-height:1.25;margin-top:5px;color:#9fe8f0;white-space:normal}
body.show-zh .card .zh{display:block}
#stopfab{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:6px;min-height:48px;padding:0 18px;border-radius:99px;border:0;background:var(--amber);color:#152238;font:inherit;font-weight:700;font-size:15px;box-shadow:0 6px 22px #0008;cursor:pointer}
.fit{display:inline-block;white-space:nowrap}
#tabwrap{display:flex;align-items:center;gap:2px;padding:0 6px}
.tarrow{flex:0 0 auto;width:34px;height:44px;border:1px solid var(--line);border-radius:12px;background:#10233b;color:var(--ink);font-size:22px;cursor:pointer}
.tarrow:active{background:#173858}
@media(hover:none){.tarrow{display:none}}
#tabs{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:4px 6px 10px;scrollbar-width:thin;scrollbar-color:#35d9ec #0b1b30;cursor:grab;user-select:none;-webkit-user-select:none}
#tabs.dragging{cursor:grabbing}
#tabs.dragging button{pointer-events:none}
#tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:0 16px;min-height:44px;background:#10233b;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
#tabs button.on{background:#eaf7ff;color:#092039;border-color:#8be8f4}
#count{padding:0 14px 6px;color:var(--muted);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 12px 28px;--fs:24px}
#grid[data-cols="1"]{grid-template-columns:1fr;--fs:32px}
#grid[data-cols="2"]{grid-template-columns:repeat(2,1fr);--fs:24px}
#grid[data-cols="3"]{grid-template-columns:repeat(3,1fr);--fs:19px}
@media(min-width:700px){
  #grid{gap:10px;padding:0 20px 28px}
  #grid[data-cols="1"]{--fs:34px;max-width:760px;margin:0 auto}
  #grid[data-cols="2"]{--fs:28px;max-width:1100px;margin:0 auto}
  #grid[data-cols="3"]{--fs:22px;max-width:1300px;margin:0 auto}
}
.card{background:linear-gradient(145deg,#173858,#10233b);color:#f3f8ff;border:1px solid #285276;border-radius:18px;padding:18px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:96px;overflow:hidden;font:inherit;cursor:pointer;user-select:none;transition:background .15s,color .15s,transform .12s;position:relative;overflow-wrap:anywhere}
.card b{display:block;font-size:var(--fs);font-weight:700;line-height:1.2;white-space:nowrap}
.card b.p{font-size:calc(var(--fs)*.72);font-weight:600;opacity:.85}
.card i{display:block;white-space:nowrap;font-style:normal;font-size:calc(var(--fs)*.6);opacity:.75;margin-top:4px}
.card.on{background:linear-gradient(145deg,#e7fbff,#bceeff);color:#092039;border:2px solid #35d9ec;box-shadow:0 0 20px #21c7e655}
.card.on i{opacity:.65}
.card.speaking{background:var(--amber);color:#17243a;border-color:var(--amber);box-shadow:0 0 24px #ffd16677}
.card.wrong{background:#321d37;color:#ff9bac;border:2px solid var(--red)}
.card.noaudio{background:#202c3d;color:#8494a8}
.card.noaudio::after{content:"⚠️";position:absolute;top:5px;right:8px;font-size:11px}
.card.pulse{animation:p .3s}
@keyframes p{50%{transform:scale(1.08)}}
.edit-btn,.check-btn{position:absolute;top:0;font-size:15px;line-height:1;opacity:.35;padding:6px;cursor:pointer}
.edit-btn{right:0;top:auto;bottom:0}
.check-btn{left:0}
.tag{position:absolute;top:6px;right:9px;font-size:10px;font-weight:700;letter-spacing:.5px;opacity:.55;pointer-events:none}
.card:hover .edit-btn,.card:hover .check-btn{opacity:1}
@media(max-width:600px){.edit-btn,.check-btn{opacity:.6}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0d2a3cf2;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:200;display:none;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.show{display:flex}
.mbox{background:#10233b;color:var(--ink);width:100%;max-width:500px;border-radius:20px;display:flex;flex-direction:column;max-height:80vh;box-shadow:0 10px 40px #0007;border:1px solid var(--line)}
.mhead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mhead h2{margin:0;font-size:20px}
.mhead button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.mbody{padding:16px;overflow:auto;flex:1}
.res-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0a1a2d;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;gap:8px}
.res-item span{font-size:13px;word-break:break-all;flex:1;opacity:.85}
.res-item button{border:0;background:var(--g);color:#041322;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.res-item button.play{background:#eaf3ff}
.upl{width:100%;padding:12px;background:#0a1a2d;color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:15px;cursor:pointer}

/* A+/A− 字體倍率：放在基礎卡片樣式之後，確保不被原始字級覆蓋 */
body{--font-scale:1}
.card b{font-size:calc(var(--fs) * var(--font-scale))}
.card b.p{font-size:calc(var(--fs)*.72 * var(--font-scale))}
.card i{font-size:calc(var(--fs)*.6 * var(--font-scale))}
.card .zh{font-size:calc(var(--fs)*.55 * var(--font-scale))}

/* 手機或平板真的轉成橫向後，使用橫向版面；網頁不會自行鎖定或強制旋轉 */
@media (orientation:landscape) and (min-width:650px){
  header{padding:5px 14px}
  h1{font-size:17px}
  h1 small{display:inline;margin-left:10px}
  #actions{padding-bottom:5px}
  #modes button{min-height:40px}
  .ctl{padding-bottom:5px}
  .opt{padding-bottom:5px}
  #tabwrap{padding-top:0}
  #tabs{padding-bottom:5px}
  #grid{gap:9px;padding-bottom:18px}
  .card{min-height:78px;padding:10px 7px 8px}
}

/* 「顯示圖片」：全螢幕展示 / 輪播模式。
   結構：#display-mode(縱向) = #display-stage(圖片+文字，吃剩餘空間) + #display-controls(固定在底部，不與圖片重疊) */
.word-image{display:none}
.card.has-thumb{padding-top:32px}
.card .thumb{display:block;width:100%;height:calc(var(--fs)*3.4*var(--font-scale));object-fit:contain;background:#07111f;border:1px solid #1f3d5c;border-radius:10px;padding:3px;margin-bottom:8px;cursor:zoom-in}
#display-mode{position:fixed;inset:0;z-index:140;display:none;flex-direction:column;gap:12px;padding:calc(58px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% -15%,#173d65 0%,#081426 58%);overflow:hidden}
#display-mode.show{display:flex}
#display-close{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:3;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#10233b;color:var(--ink);font-size:22px;cursor:pointer}
#display-count{position:absolute;top:calc(22px + env(safe-area-inset-top));left:16px;color:var(--muted);font-size:14px}
#display-stage{flex:1 1 0;min-height:0;width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px)}
#display-image-wrap{display:none;flex:1 1 0;min-height:0;min-width:0;width:100%;align-items:center;justify-content:center;overflow:hidden}
#display-mode.has-image #display-image-wrap{display:flex}
#display-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:14px;background:#07111f;border:1px solid #285276;padding:5px;box-shadow:0 10px 35px #0006}
#display-text{flex:0 0 auto;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vh,12px);padding:4px 10px}
#display-word{font-size:calc(clamp(44px,9vw,110px)*var(--dscale,1));font-weight:800;line-height:1.12;overflow-wrap:anywhere}
#display-kk{font-size:calc(clamp(22px,4vw,44px)*var(--dscale,1));color:#b8d8ef}
#display-zh{font-size:calc(clamp(24px,4.6vw,52px)*var(--dscale,1));color:#9fe8f0}
#display-controls{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(8px,1.6vw,18px);width:100%;padding-top:4px}
#display-controls button{min-width:54px;min-height:50px;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:#10233b;color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer}
#display-play{background:linear-gradient(135deg,#087eaa,#19c4d8)!important;color:#041322!important;min-width:104px!important}
#display-auto{background:var(--amber)!important;color:#152238!important;min-width:128px!important;border-color:var(--amber)!important}
#display-mode.no-image #display-stage{justify-content:center}
#display-mode.no-image #display-text{flex:1 1 auto;justify-content:center}
#display-mode.no-image #display-word{font-size:calc(clamp(56px,12vw,150px)*var(--dscale,1))}
/* 橫向：圖片在左、文字在右；控制列仍在最下方 */
@media (orientation:landscape) and (min-width:650px){
  #display-stage{flex-direction:row;gap:clamp(14px,3vw,42px)}
  #display-image-wrap{flex:1 1 58%;width:auto;height:100%}
  #display-text{flex:1 1 42%;width:auto;padding:8px}
  #display-mode.no-image #display-stage{flex-direction:column}
}

/* 圖片放大檢視（原稿 HTML 有此元素但缺少樣式，預設隱藏） */
#image-viewer{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;background:#000d;padding:20px}
#image-viewer.show{display:flex}
#image-viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;background:#07111f;padding:5px}
#image-viewer button{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top));width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#10233b;color:var(--ink);font-size:22px;cursor:pointer}
</style></head>
<body>
<header>
  <a class="hbtn" href="index.html" title="回首頁">🏠</a>
  <h1 id="title">英文課本<small>WORD MISSION · LEARN &amp; PLAY</small></h1>
</header>
<div id="actions">
  <button class="hbtn" id="restore">↩️ 還原</button>
  <button class="hbtn" id="shuffle">🔀 打亂</button>
  <button class="hbtn" id="ren">✏️ 改名</button>
  <button class="hbtn" id="exp">💾 匯出</button>
</div>

<div id="modes">
  <button data-mode="read" class="on">🎧 聽讀</button>
  <button data-mode="test">✍️ 考試</button>
  <button data-mode="correct">🔁 訂正</button>
</div>

<div id="read-controls" class="ctl show">
  <button id="btn-read-all">▶️ 全部導讀</button>
  <button id="btn-read-manual" class="active">✋ 我自己按</button>
</div>
<div class="opt" id="layout-row"><span>排版</span>
  <button data-lay="1">1行1字</button><button data-lay="2">1行2字</button><button data-lay="3">1行3字</button></div>
<div class="opt" id="speed-row"><span>語速</span>
  <button data-spd="0.7">0.7x</button><button data-spd="0.8">0.8x</button><button data-spd="0.9">0.9x</button><button data-spd="1">1x</button><button data-spd="1.1">1.1x</button></div>
<div class="opt" id="repeat-row"><span>遍數</span>
  <button data-rep="1">念 1 遍</button><button data-rep="2">念 2 遍</button></div>
<div id="extra-tools">
  <label><input type="checkbox" id="show-chinese"> 顯示中文</label>
  <label id="image-toggle-wrap" style="display:none"><input type="checkbox" id="show-images"> 顯示圖片</label>
  <button type="button" id="font-down">A−</button>
  <button type="button" id="font-up">A＋</button>
  <button type="button" id="progress-reset">↺ 本分類改回未讀</button>
</div>

<div id="tabwrap"><button class="tarrow" id="tl" aria-label="向左">‹</button><div id="tabs"></div><button class="tarrow" id="tr" aria-label="向右">›</button></div>
<div id="count"></div>
<div id="grid"></div>
<div id="toast"></div>
<button id="stopfab">⏹ 停止導讀</button>

<div id="modal">
  <div class="mbox">
    <div class="mhead"><h2>替換音檔</h2><button id="modal-close">✕</button></div>
    <div class="mbody">
      <p style="margin-top:0;font-size:14px;opacity:.7" id="modal-title"></p>
      <div id="audio-list"></div>
    </div>
  </div>
</div>
<input type="file" id="upload-audio" accept="audio/*" style="display:none">
<div id="display-mode" aria-live="polite">
  <span id="display-count"></span><button id="display-close" type="button" aria-label="關閉展示模式">✕</button>
  <div id="display-stage">
    <div id="display-image-wrap"><img id="display-image" alt="單字圖片"></div>
    <div id="display-text"><div id="display-word"></div><div id="display-kk"></div><div id="display-zh"></div></div>
  </div>
  <div id="display-controls"><button id="display-prev" type="button" aria-label="上一個">‹</button><button id="display-play" type="button">▶ 發音</button><button id="display-auto" type="button">▶ 全部導讀</button><button id="display-next" type="button" aria-label="下一個">›</button><button id="display-font-down" type="button" aria-label="縮小文字">A−</button><button id="display-font-up" type="button" aria-label="放大文字">A＋</button></div>
</div>
<div id="image-viewer" aria-label="放大圖片"><button type="button" aria-label="關閉">✕</button><img alt="單字圖片放大檢視"></div>

const _imgUrls = {};
function imgSrc(it){
  const key = it && it.img;
  if(!key || !IMAGES[key]) return '';
  if(!_imgUrls[key]){
    try {
      const [head, b64] = IMAGES[key].split(',');
      const mime = (head.match(/:(.*?);/) || [])[1] || 'image/webp';
      const bin = atob(b64), u8 = new Uint8Array(bin.length);
      for(let n = 0; n < bin.length; n++) u8[n] = bin.charCodeAt(n);
      _imgUrls[key] = URL.createObjectURL(new Blob([u8], {type: mime}));
    } catch(e) { _imgUrls[key] = IMAGES[key]; }
  }
  return _imgUrls[key];
}
const HAS_IMAGES = true;
const BIND0 = {};
const TRACK_PROGRESS = false;
const COURSE_KEY = 'english_read_progress_v1:2英文課本';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BKEY = 'english_audio_bindings_v3';

let cats = Object.keys(DATA), cur = cats[0];
let order = {}, state = {};
let completedCategories = {};
try { if(TRACK_PROGRESS) completedCategories = JSON.parse(localStorage.getItem(COURSE_KEY) || '{}') || {}; } catch(e) {}
function saveProgress(){ try { localStorage.setItem(COURSE_KEY, JSON.stringify(completedCategories)); } catch(e) {} }
function updateProgressUI(){
  $('#progress-reset').style.display = TRACK_PROGRESS ? 'inline-flex' : 'none';
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('done', !!completedCategories[b.dataset.c]));
}
let mode = 'read', repeatCount = 2, editWord = null;
let bind = Object.assign({}, BIND0);
try { Object.assign(bind, JSON.parse(localStorage.getItem(BKEY) || '{}')); } catch (e) {}
function saveBind(){ try { localStorage.setItem(BKEY, JSON.stringify(bind)); } catch (e) { toast('儲存空間不足，請按「匯出」保存'); } }

// 每個詞（variant）目前實際使用的音檔：C 永遠優先 → 手動綁定 → 預設
function varSrcs(v){
  const b = bind[v.k];
  if(!v.c && b){ if(b.data) return [b.data]; if(b.key && AUDIO[b.key]) return [AUDIO[b.key]]; }
  return (v.a || []).map(k => AUDIO[k]).filter(Boolean);
}
function srcsOf(it){ return it.vs.map(varSrcs).filter(x => x.length); }
// 卡片右上角的小標籤：目前實際使用的音檔來源（C / OX / A / B / UP=自行上傳）
function labelsOf(it){
  const v = it.vs[0]; if(!v) return '';
  const b = !v.c && bind[v.k];
  if(b) return b.data ? 'UP' : (b.label || (b.key || '').split('|')[0]);
  return (v.a || []).length ? v.a[0].split('|')[0] : '';
}
function hasAudio(it){ return srcsOf(it).length > 0; }

function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rebuild(c){ order[c] = DATA[c].map((_, i) => i); state[c] = {}; }   // 預設照 Excel 原本順序
cats.forEach(rebuild);
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 1800); }

// ---- 播放 ----
let curAudio = null, curRes = null, runId = 0;
function playOnce(src){
  return new Promise(res => {
    if(!src){ res(); return; }
    const a = new Audio(src);
    a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true;
    a.playbackRate = speed;
    curAudio = a; curRes = res;
    a.onended = a.onerror = () => res();
    a.play().catch(() => res());
  });
}
function stopAll(){
  runId++;
  if(curAudio){ try { curAudio.pause(); } catch (e) {} curAudio = null; }
  if(curRes){ curRes(); curRes = null; }
  document.querySelectorAll('.card.speaking').forEach(el => el.classList.remove('speaking'));
  reading = false; setFab(false);
  const da = $('#display-auto'); if(da) da.textContent = '▶ 全部導讀';
  const dp = $('#display-play'); if(dp) dp.textContent = '▶ 發音';
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 一個字卡 = 多個詞（father, dad, daddy）：依序各播一次，整組重複 repeatCount 遍
async function playItem(it, id, firstOnly){
  let groups = srcsOf(it);
  if(firstOnly){
    const g = varSrcs(it.vs[0]);
    groups = g.length ? [g] : groups.slice(0, 1);
  }
  for(let n = 0; n < repeatCount; n++){
    for(let g = 0; g < groups.length; g++){
      for(const src of groups[g]){ if(id !== runId) return; await playOnce(src); }
      if(g < groups.length - 1 && id === runId) await sleep(300);
    }
    if(n < repeatCount - 1 && id === runId) await sleep(450);
  }
}

// ---- 畫面 ----
function cardHtml(i, extra){
  const it = DATA[cur][i];
  const [l1, l2] = wordLines(it.w);
  let cls = 'card' + extra;
  if(!hasAudio(it)) cls += ' noaudio';
  if(it.img) cls += ' has-image';
  const thumb = (opts.showImages && it.img) ? imgSrc(it) : '';
  if(thumb) cls += ' has-thumb';
  return `<button class="${cls}" data-i="${i}">
    <div class="edit-btn" data-edit="${i}" title="替換音檔">🎙</div>
    <div class="check-btn" data-check="${i}" title="標記錯誤">✔️</div>
    <span class="tag">${esc(labelsOf(it))}</span>
    ${thumb ? `<img class="thumb" data-zoom="${i}" src="${thumb}" alt="${esc(it.w)}">` : ''}
    <div class="card-main"><b><span class="fit">${esc(l1)}</span></b>${l2 ? `<b class="p"><span class="fit">${esc(l2)}</span></b>` : ''}${it.zh ? `<span class="zh">${esc(it.zh)}</span>` : ''}${it.kk ? `<i><span class="fit">${esc(it.kk)}</span></i>` : ''}</div>
</button>`;
}
function wordLines(w){
  const m = w.match(/^([^(（]*?)\s*([(（].*)$/);
  return (m && m[1].trim()) ? [m[1].trim(), m[2].trim()] : [w, ''];
}
function fitAll(){
  document.querySelectorAll('#grid .card').forEach(card => {
    const avail = card.clientWidth - 20;
    card.querySelectorAll('.fit').forEach(el => {
      el.style.fontSize = '';
      const w = el.getBoundingClientRect().width;
      if(w > avail){
        const base = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = Math.max(8, base * avail / w - 0.5) + 'px';
      }
    });
  });
}
let fitT = null;
window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitAll, 120); });
function renderGrid(){
  const g = $('#grid');
  if(mode === 'correct'){
    const wrong = order[cur].filter(i => state[cur][i] === 'wrong');
    $('#count').textContent = `錯誤 ${wrong.length} 字`;
    g.innerHTML = wrong.length ? wrong.map(i => cardHtml(i, ' wrong')).join('')
      : '<p style="grid-column:1/-1;text-align:center;font-size:20px;padding:40px;color:var(--g)">太棒了！沒有錯字 🎉</p>';
    fitAll();
    return;
  }
  const n = order[cur].length, w = order[cur].filter(i => state[cur][i] === 'wrong').length;
  $('#count').textContent = `共 ${n} 字` + (w ? `・已標錯 ${w}` : '');
  g.innerHTML = order[cur].map(i => {
    const st = state[cur][i];
    return cardHtml(i, st === 'white' ? ' on' : st === 'wrong' ? ' wrong' : '');
  }).join('');
  fitAll();
}
let displayMode = false;
let displayPos = 0;
function displaySequence(){
  if(mode === 'correct') return order[cur].filter(i => state[cur][i] === 'wrong');
  return order[cur];
}
function renderDisplay(){
  const seq = displaySequence();
  if(!seq.length){
    $('#display-mode').classList.remove('has-image');
    $('#display-mode').classList.add('no-image');
    $('#display-word').textContent = '沒有可顯示的單字';
    $('#display-kk').textContent = '';
    $('#display-zh').textContent = '';
    $('#display-image').removeAttribute('src');
    $('#display-count').textContent = '0 / 0';
    return;
  }
  displayPos = Math.max(0, Math.min(displayPos, seq.length - 1));
  const i = seq[displayPos], it = DATA[cur][i];
  const img = imgSrc(it);
  $('#display-mode').classList.toggle('has-image', !!img);
  $('#display-mode').classList.toggle('no-image', !img);
  if(img){ $('#display-image').src = img; $('#display-image').alt = it.w; }
  else $('#display-image').removeAttribute('src');
  $('#display-word').textContent = it.w;
  $('#display-kk').textContent = it.kk || '';
  $('#display-kk').style.display = it.kk ? 'block' : 'none';
  $('#display-zh').textContent = (opts.showChinese && it.zh) ? it.zh : '';
  $('#display-zh').style.display = (opts.showChinese && it.zh) ? 'block' : 'none';
  $('#display-count').textContent = `${displayPos + 1} / ${seq.length}`;
}
function openDisplayMode(startIdx){
  if(!HAS_IMAGES){
    toast('這本教材沒有配對圖片');
    $('#show-images').checked = false;
    opts.showImages = false;
    saveOpts();
    return;
  }
  displayMode = true;
  stopAll();
  const _seq = displaySequence();
  displayPos = Math.max(0, _seq.indexOf(startIdx));
  $('#display-mode').classList.add('show');
  document.body.classList.add('display-open');
  renderDisplay();
}

function closeDisplayMode(){
  displayMode = false;
  $('#display-mode').classList.remove('show');
  document.body.classList.remove('display-open');
  stopAll();
}

function moveDisplay(delta){
  const seq = displaySequence();
  if(!seq.length) return;
  displayPos = (displayPos + delta + seq.length) % seq.length;
  stopAll();
  renderDisplay();
}

$('#display-close').onclick = () => {
  closeDisplayMode();
  $('#btn-read-manual').onclick();
};
$('#display-auto').onclick = () => {
  if(reading){ $('#btn-read-manual').onclick(); return; }
  displayAuto(displayPos === 0 && mode === 'read');
};
$('#display-prev').onclick = () => moveDisplay(-1);
$('#display-next').onclick = () => moveDisplay(1);

$('#display-play').onclick = async () => {
  const seq = displaySequence();
  if(!seq.length) return;
  const it = DATA[cur][seq[displayPos]];
  stopAll();
  const id = runId;
  $('#display-play').textContent = '⏸ 播放中';
  await playItem(it, id);
  if(id === runId) $('#display-play').textContent = '▶ 發音';
};

let touchStartX = 0, touchStartY = 0;
$('#display-mode').addEventListener('touchstart', e => {
  if(e.touches.length){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, {passive:true});

$('#display-mode').addEventListener('touchend', e => {
  if(!e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
    moveDisplay(dx < 0 ? 1 : -1);
  }
}, {passive:true});

window.addEventListener('keydown', e => {
  if(!displayMode) return;
  if(e.key === 'Escape') closeDisplayMode();
  if(e.key === 'ArrowRight') moveDisplay(1);
  if(e.key === 'ArrowLeft') moveDisplay(-1);
});

function renderTabs(){
  $('#tabs').innerHTML = cats.map(c =>
    `<button data-c="${esc(c)}" class="${c === cur ? 'on' : ''} ${completedCategories[c] ? 'done' : ''}">${esc(c)}</button>`
  ).join('');
  updateProgressUI();
}

// ---- 模式 ----
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modes button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.mode;
  stopAll();
  $('#read-controls').classList.toggle('show', mode === 'read');
  $('#speed-row').classList.toggle('hide', mode === 'correct');
  $('#repeat-row').classList.toggle('hide', mode === 'correct');
  toast(
    mode === 'read' ? '請選擇「全部導讀」或「我自己按」' :
    mode === 'test' ? '考試模式：點一下翻亮並發音' :
    '訂正模式：只顯示標錯的字'
  );
  renderGrid();
  if(displayMode){
    displayPos = 0;
    renderDisplay();
  }
});

let reading = false;

async function autoRead(startPos, markCompleted=false){
  stopAll();
  const id = runId;
  reading = true;
  setFab(true);
  const seq = order[cur];

  for(let p = startPos; p < seq.length; p++){
    if(id !== runId) return;
    const i = seq[p], it = DATA[cur][i];
    const el = document.querySelector(`.card[data-i="${i}"]`);

    if(el){
      el.classList.add('speaking');
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }

    await playItem(it, id, true);
    if(id !== runId) return;
    if(el) el.classList.remove('speaking');

    await new Promise(r => setTimeout(r, 1500));
  }

  if(id === runId){
    finishRead(seq, markCompleted);
    $('#btn-read-manual').onclick();
  }
}

function finishRead(seq, markCompleted){
  if(TRACK_PROGRESS && markCompleted){
    const missingAudio = seq.filter(i =>
      !DATA[cur][i].vs.length ||
      !varSrcs(DATA[cur][i].vs[0]).length
    ).length;

    if(missingAudio === 0){
      completedCategories[cur] = true;
      saveProgress();
      renderTabs();
      toast('完整導讀完成！已標記已讀 ✓');
    } else {
      toast(`導讀結束，但有 ${missingAudio} 個單字沒有可播放音檔，暫不標記已讀`);
    }
  } else {
    toast('導讀結束！');
  }
}

// 圖片輪播：在展示模式中，自動顯示圖片 → 發音 → 等 1.5 秒 → 下一個
async function displayAuto(markCompleted){
  stopAll();
  const id = runId;
  reading = true;
  $('#display-auto').textContent = '⏹ 停止';
  const seq = displaySequence();

  for(let p = displayPos; p < seq.length; p++){
    if(id !== runId) return;
    displayPos = p;
    renderDisplay();
    await playItem(DATA[cur][seq[p]], id, true);
    if(id !== runId) return;
    await sleep(1500);
  }

  if(id === runId){
    finishRead(order[cur], markCompleted);
    $('#btn-read-manual').onclick();
  }
}

function setFab(v){
  $('#stopfab').style.display = v ? 'flex' : 'none';
}

$('#stopfab').onclick = () => $('#btn-read-manual').onclick();

$('#btn-read-all').onclick = () => {
  $('#btn-read-all').classList.add('active');
  $('#btn-read-manual').classList.remove('active');
  if(opts.showImages && HAS_IMAGES){
    openDisplayMode();
    displayAuto(true);
    return;
  }
  autoRead(0, true);
};

$('#btn-read-manual').onclick = () => {
  $('#btn-read-manual').classList.add('active');
  $('#btn-read-all').classList.remove('active');
  stopAll();
};

// ---- 排版 / 語速 / 遍數（會記住）----
const OPT_KEY = 'english_drill_opts_v2';
const opts = {
  cols: 2,
  speed: 0.9,
  repeat: 2,
  fontScale: 1,
  showChinese: false,
  showImages: false,
  displayScale: 1
};

try {
  Object.assign(opts, JSON.parse(localStorage.getItem(OPT_KEY) || '{}'));
} catch(e) {}

opts.cols = [1,2,3].includes(+opts.cols) ? +opts.cols : 2;
opts.speed = [0.7,0.8,0.9,1,1.1].includes(+opts.speed) ? +opts.speed : 0.9;
opts.repeat = [1,2].includes(+opts.repeat) ? +opts.repeat : 2;
opts.fontScale = Math.max(0.7, Math.min(1.8, Number(opts.fontScale) || 1));
opts.displayScale = Math.max(0.6, Math.min(2.4, Number(opts.displayScale) || 1));
opts.showChinese = !!opts.showChinese;
opts.showImages = !!opts.showImages;

function saveOpts(){
  try {
    localStorage.setItem(OPT_KEY, JSON.stringify(opts));
  } catch(e) {}
}

let speed = opts.speed;
repeatCount = opts.repeat;

function applyOpts(){
  $('#grid').dataset.cols = opts.cols;
  document.body.style.setProperty('--font-scale', opts.fontScale);
  $('#display-mode').style.setProperty('--dscale', opts.displayScale);
  document.body.classList.toggle('show-zh', !!opts.showChinese);
  $('#show-chinese').checked = !!opts.showChinese;

  if(HAS_IMAGES) $('#image-toggle-wrap').style.display = 'inline-flex';

  $('#show-images').checked = !!opts.showImages;

  document.querySelectorAll('[data-lay]').forEach(b =>
    b.classList.toggle('active', +b.dataset.lay === opts.cols)
  );
  document.querySelectorAll('[data-spd]').forEach(b =>
    b.classList.toggle('active', +b.dataset.spd === opts.speed)
  );
  document.querySelectorAll('[data-rep]').forEach(b =>
    b.classList.toggle('active', +b.dataset.rep === opts.repeat)
  );
}

document.querySelectorAll('[data-lay]').forEach(b => b.onclick = () => {
  opts.cols = +b.dataset.lay;
  saveOpts();
  applyOpts();
  fitAll();
});

document.querySelectorAll('[data-spd]').forEach(b => b.onclick = () => {
  opts.speed = speed = +b.dataset.spd;
  saveOpts();
  applyOpts();
  if(curAudio) curAudio.playbackRate = speed;
  toast('語速 ' + speed + 'x');
});

document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => {
  opts.repeat = repeatCount = +b.dataset.rep;
  saveOpts();
  applyOpts();
  toast('每個字念 ' + repeatCount + ' 遍');
});

applyOpts();

$('#show-chinese').onchange = e => {
  opts.showChinese = e.target.checked;
  saveOpts();
  applyOpts();
  fitAll();
  if(displayMode) renderDisplay();
};

$('#show-images').onchange = e => {
  opts.showImages = e.target.checked;
  saveOpts();
  renderGrid();
  toast(opts.showImages ? '已顯示縮圖：點縮圖可放大；按「全部導讀」進入圖片輪播' : '已隱藏圖片');
};

$('#font-down').onclick = () => {
  opts.fontScale = Math.max(0.7, +(opts.fontScale - 0.1).toFixed(2));
  saveOpts();
  applyOpts();
  fitAll();
};

$('#font-up').onclick = () => {
  opts.fontScale = Math.min(1.8, +(opts.fontScale + 0.1).toFixed(2));
  saveOpts();
  applyOpts();
  fitAll();
};

$('#display-font-down').onclick = () => {
  opts.displayScale = Math.max(0.6, +(opts.displayScale - 0.15).toFixed(2));
  saveOpts();
  applyOpts();
};
$('#display-font-up').onclick = () => {
  opts.displayScale = Math.min(2.4, +(opts.displayScale + 0.15).toFixed(2));
  saveOpts();
  applyOpts();
};

$('#progress-reset').onclick = () => {
  if(!TRACK_PROGRESS) return;
  if(!confirm(`確定將「${cur}」改回未讀狀態？`)) return;
  delete completedCategories[cur];
  saveProgress();
  updateProgressUI();
  toast('已改回未讀');
};

// ---- 分類切換 ----
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-c]');
  if(!b) return;
  const c = b.dataset.c;
  if(!DATA[c]) return;

  stopAll();
  cur = c;
  renderTabs();
  renderGrid();

  if(displayMode){
    displayPos = 0;
    renderDisplay();
  }
});

$('#tl').onclick = () => {
  $('#tabs').scrollBy({left:-240, behavior:'smooth'});
};
$('#tr').onclick = () => {
  $('#tabs').scrollBy({left:240, behavior:'smooth'});
};

// 電腦可拖曳分類列
(() => {
  const el = $('#tabs');
  let down = false, startX = 0, scrollLeft = 0, moved = false;

  el.addEventListener('mousedown', e => {
    down = true;
    moved = false;
    startX = e.pageX - el.offsetLeft;
    scrollLeft = el.scrollLeft;
  });

  window.addEventListener('mouseup', () => {
    down = false;
    el.classList.remove('dragging');
  });

  el.addEventListener('mouseleave', () => {
    down = false;
    el.classList.remove('dragging');
  });

  el.addEventListener('mousemove', e => {
    if(!down) return;
    const x = e.pageX - el.offsetLeft;
    const walk = (x - startX) * 1.3;
    if(Math.abs(walk) > 4 && !moved){ moved = true; el.classList.add('dragging'); }
    if(moved){
      e.preventDefault();
      el.scrollLeft = scrollLeft - walk;
    }
  });
})();

// ---- 卡片點擊：聽讀 / 考試 / 訂正 ----
$('#grid').addEventListener('click', async e => {
  const zb = e.target.closest('[data-zoom]');
  if(zb){
    openDisplayMode(+zb.dataset.zoom);
    return;
  }

  const eb = e.target.closest('[data-edit]');
  if(eb){
    openPicker(DATA[cur][+eb.dataset.edit]);
    return;
  }

  const cb = e.target.closest('[data-check]');
  if(cb){
    const i = +cb.dataset.check;
    state[cur][i] = state[cur][i] === 'wrong' ? null : 'wrong';
    renderGrid();
    if(displayMode) renderDisplay();
    return;
  }

  const card = e.target.closest('.card');
  if(!card) return;

  const i = +card.dataset.i;
  const it = DATA[cur][i];

  if(mode === 'read'){
    if($('#btn-read-all').classList.contains('active')){
      return;
    }
    stopAll();
    const id = runId;
    card.classList.add('speaking');
    await playItem(it, id, true);
    if(id === runId) card.classList.remove('speaking');
    return;
  }

  if(mode === 'test'){
    state[cur][i] = state[cur][i] === 'white' ? null : 'white';
    renderGrid();
    const el = document.querySelector(`.card[data-i="${i}"]`);
    if(el){
      el.classList.add('pulse');
      setTimeout(() => el.classList.remove('pulse'), 300);
    }
    return;
  }

  if(mode === 'correct'){
    state[cur][i] = null;
    renderGrid();
    if(displayMode) renderDisplay();
  }
});

// ---- 圖片放大檢視 ----
$('#image-viewer').onclick = e => {
  if(e.target.id === 'image-viewer' || e.target.tagName === 'BUTTON'){
    $('#image-viewer').classList.remove('show');
  }
};

window.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    $('#image-viewer').classList.remove('show');
  }
});

// ---- 音檔管理 ----
$('#modal-close').onclick = () => $('#modal').classList.remove('show');

let editKey = null, editLabel = '';

function openPicker(it){
  $('#modal-title').textContent = '正在替換：' + it.w;
  let html = '';

  it.vs.forEach((v, vi) => {
    const files = INDEX[v.k] || [];
    const hasC = files.some(f => f.label === 'C');

    html += `<h3 style="font-size:16px;margin:${vi ? 18 : 0}px 0 8px">${esc(v.t)}</h3>`;

    if(hasC){
      html += '<p style="font-size:13px;color:var(--amber);margin:0 0 8px">此字有 AudiosC 音檔，C 永遠優先。</p>';
    }

    if(!files.length){
      html += '<p style="opacity:.6;margin:0 0 8px">沒有找到這個詞的音檔' +
        ((v.a || []).length > 1 ? '（目前用單字拼接播放）' : '') +
        '</p>';
    } else {
      html += files.map((f, i) => `<div class="res-item">
        <span>[${f.label === 'OX' ? 'Oxford 5000' : f.label}] ${esc(f.fname)}${f.accent ? ' · ' + esc(f.accent) : ''}</span>
        <div style="display:flex;gap:8px">
          <button class="play" data-v="${vi}" data-play="${i}">▶ 試聽</button>
          ${hasC ? '' : `<button data-v="${vi}" data-apply="${i}">套用</button>`}
        </div>
      </div>`).join('');
    }

    if(!hasC){
      html += `<button class="upl" data-up="${vi}">📁 上傳「${esc(v.t)}」的音檔</button>`;
    }
  });

  const list = $('#audio-list');
  list.innerHTML = html;

  list.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    const f = (INDEX[it.vs[+b.dataset.v].k] || [])[+b.dataset.play];
    stopAll();
    playOnce(AUDIO[f.key]);
  });

  list.querySelectorAll('[data-apply]').forEach(b => b.onclick = () => {
    const v = it.vs[+b.dataset.v];
    const f = (INDEX[v.k] || [])[+b.dataset.apply];

    bind[v.k] = {key: f.key, label: f.label, fname: f.fname};
    saveBind();
    toast('已替換「' + v.t + '」的音檔');
    $('#modal').classList.remove('show');
    renderGrid();
  });

  list.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    editKey = it.vs[+b.dataset.up].k;
    editLabel = it.vs[+b.dataset.up].t;
    $('#upload-audio').click();
  });

  $('#modal').classList.add('show');
}

$('#upload-audio').onchange = e => {
  const f = e.target.files[0];
  if(!f || !editKey) return;

  const key = editKey;
  const label = editLabel;
  const rd = new FileReader();

  rd.onload = evt => {
    bind[key] = {
      label: 'UP',
      fname: '自訂上傳',
      data: evt.target.result
    };

    saveBind();
    toast('已替換「' + label + '」的音檔');
    $('#upload-audio').value = '';
    $('#modal').classList.remove('show');
    renderGrid();
  };

  rd.readAsDataURL(f);
};

// ---- 打亂 / 還原（只作用在目前這個分類）----
$('#shuffle').onclick = () => {
  stopAll();
  order[cur] = shuffle(order[cur]);
  renderGrid();
  if(displayMode){ displayPos = 0; renderDisplay(); }
  toast('已打亂「' + cur + '」的順序');
};
$('#restore').onclick = () => {
  stopAll();
  order[cur] = DATA[cur].map((_, i) => i);
  renderGrid();
  if(displayMode){ displayPos = 0; renderDisplay(); }
  toast('已還原「' + cur + '」的原本順序');
};

// ---- 改名 / 匯出 ----
$('#ren').onclick = () => {
  const name = prompt('這個分類要叫什麼？', cur);
  if(!name || name === cur || DATA[name]) return;
  const old = cur;
  const rebuilt = {};
  cats.forEach(c => { rebuilt[c === old ? name : c] = DATA[c]; });
  for(const k of Object.keys(DATA)) delete DATA[k];
  Object.assign(DATA, rebuilt);
  order[name] = order[old]; state[name] = state[old];
  delete order[old]; delete state[old];
  cats = Object.keys(DATA); cur = name;
  renderTabs(); renderGrid();
  if(displayMode){ displayPos = 0; renderDisplay(); }
  toast('已改名為「' + name + '」');
};

$('#exp').onclick = () => {
  if(Object.keys(bind).length > 0){
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => {
      const rows = [['分類', '單字', 'KK', '中文', '音檔']];
      for(const c in DATA) for(const it of DATA[c]){
        const parts = it.vs.map(v => {
          const b = bind[v.k];
          return b ? (b.label || '') + '|' + b.fname : (v.f || '');
        });
        rows.push([c, it.w, it.kk, it.zh, parts.some(x => x) ? parts.join(';') : '']);
      }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '單字');
      XLSX.writeFile(wb, TITLE + '_已綁定.xlsx');
      toast('已下載新 Excel，請覆蓋原本的檔案');
      exportHtml();
    };
    s.onerror = () => {
      toast('無法載入 Excel 元件，只匯出 HTML');
      exportHtml();
    };
    document.head.appendChild(s);
  } else {
    exportHtml();
  }
};

function exportHtml(){
  const root = document.documentElement.cloneNode(true);
  root.querySelector('#grid').innerHTML = '';
  root.querySelector('#tabs').innerHTML = '';
  root.querySelector('#toast').style.display = 'none';
  root.querySelectorAll('script[src]').forEach(x => x.remove());
  const sc = root.querySelector('#main-script');
  const safe = JSON.stringify(bind).replace(/</g, '\\u003c');
  sc.textContent = sc.textContent.replace(
    new RegExp('const BIND0' + ' = .*;\\n'),
    () => 'const BIND0' + ' = ' + safe + ';\n'
  );
  const blob = new Blob(['<!DOCTYPE html>\n' + root.outerHTML], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = TITLE + '.html';
  a.click();
  toast('HTML 已匯出');
}

renderTabs();
renderGrid();
</script>
</body></html>
