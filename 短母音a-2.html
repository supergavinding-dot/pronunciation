<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>情境單字圖</title>
<style>
:root{--paper:#f4efe3;--ink:#23332b;--g:#1f6b4a;--amber:#e8a33d;--line:#d9d1bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:8px 12px}
#home{padding:10px 4px;font-weight:700;color:var(--g);text-decoration:none;white-space:nowrap}
#pname{flex:1;min-width:0;border:0;background:none;font-weight:700;font-size:19px;padding:6px 0}
.seg{display:flex;background:#e6dfcc;border-radius:12px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;min-height:40px}
body.m-edit .seg [data-m=edit],body.m-learn .seg [data-m=learn]{background:var(--g);color:#fff}
#clrAll{display:none;width:44px;height:44px;font-size:21px;border-radius:12px;background:#f3d9d2}
body.m-edit #clrAll{display:block}
#menuBtn{width:44px;height:44px;font-size:24px;border-radius:12px}
#menu{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 56px);background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;padding:6px;z-index:30;min-width:200px}
#menu button,#menu label{display:flex;align-items:center;gap:10px;width:100%;padding:12px;min-height:44px;border-radius:9px;text-align:left}
#menu button:active{background:#f1ecdd}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px}
#stage{position:relative;container-type:inline-size;border-radius:14px;overflow:hidden;background:#cfe3c0;box-shadow:0 2px 14px #0002}
#stage img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.demo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6cqw;font-size:4.6cqw;color:#8a8470;background:#ebe5d3;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*1cqw);display:flex;flex-direction:column;align-items:center;line-height:1.2;white-space:nowrap;padding:.28em .65em;border-radius:99px;background:#fffdf6ee;border:.08em solid var(--ink);box-shadow:0 .15em .5em #0003;touch-action:none;user-select:none;-webkit-user-select:none}
.tag i{font-style:normal;font-size:.62em;opacity:.8}
.tag.sel{outline:.14em solid var(--amber);outline-offset:.1em}
.tag.pulse{animation:p .35s}
@keyframes p{50%{transform:translate(-50%,-50%) scale(1.18);background:#fff3c9}}
.nokk .kk,.nozh .zh{display:none}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px}
body.m-edit footer{display:flex}
#dockRow{display:flex;gap:8px;align-items:center}
#addBtn{background:var(--g);color:#fff;font-weight:700;border-radius:14px;padding:0 18px;min-height:48px;white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 14px;min-height:44px;white-space:nowrap}
.hint{opacity:.55;font-size:14px}
#selbar{display:none;gap:6px;background:#fff;border-radius:14px;padding:6px;justify-content:space-around}
body.sel #selbar{display:flex}
#selbar button{flex:1;min-height:46px;font-size:20px;border-radius:10px}
#selbar button:active{background:#f1ecdd}
#bd{position:fixed;inset:0;background:#0004;opacity:0;pointer-events:none;transition:.2s;z-index:40}
body.sheet #bd{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;height:80dvh;background:var(--paper);border-radius:22px 22px 0 0;z-index:41;transform:translateY(105%);transition:transform .28s;display:flex;flex-direction:column}
body.sheet #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#bdb59f;margin:8px auto 4px}
#sf{display:flex;gap:8px;padding:6px 14px}
#q{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px;background:#fff;font-size:18px}
#sf button{background:var(--ink);color:#fff;border-radius:12px;padding:0 18px;font-weight:600}
#result{flex:1;overflow:auto;padding:6px 14px calc(14px + env(safe-area-inset-bottom))}
.wd{display:flex;align-items:baseline;gap:10px}.wd h2{margin:4px 0;font-size:32px}
.ph{display:flex;gap:8px;margin:6px 0}
.ph button{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:56px;text-align:left}
.ph b{display:block;font-weight:500;font-size:15px}
label.f{display:block;font-size:13px;opacity:.7;margin:8px 0}
label.f input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;background:#fff;font-size:17px;opacity:1;color:var(--ink)}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin:10px 0}
.tabs button{flex:1;padding:10px;font-weight:600;opacity:.5;min-height:44px}
.tabs .on{opacity:1;border-bottom:3px solid var(--g);margin-bottom:-1.5px}
#result p{margin:6px 0}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.go{position:sticky;bottom:0;width:100%;margin-top:12px;background:var(--g);color:#fff;font-weight:700;border-radius:14px;min-height:52px;font-size:17px}
#info{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 30px #0003;z-index:20}
#info h3{margin:0;font-size:26px}
#info .r{display:flex;gap:8px;margin-top:8px}
#info .r button{flex:1;background:#f1ecdd;border-radius:10px;min-height:46px}
#info .x{position:absolute;right:6px;top:4px;width:44px;height:44px;font-size:22px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#23332bee;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px}
.zc{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 6px}.zc .chip{min-height:36px}
#sx{position:absolute;right:6px;top:4px;width:44px;height:44px;font-size:20px;opacity:.6}
@media (min-width:760px){
#bd{display:none}
#sheet{top:0;bottom:auto;right:auto;width:380px;height:100dvh;border-radius:0 22px 22px 0;transform:translateX(-105%);box-shadow:4px 0 24px #0003;padding-top:env(safe-area-inset-top)}
body.sheet #sheet{transform:none}
body.sheet header,body.sheet #wrap,body.sheet footer{margin-left:380px}
}
</style></head>
<body class="">
<header>
  <a id="home" href="index.html" hidden="">‹ 目錄</a>
  <input id="pname" value="動物園" aria-label="專案名稱">
  <div class="seg"><button data-m="edit">編輯</button><button data-m="learn">學習</button></div>
  <button id="clrAll" aria-label="一鍵全清除" title="一鍵全清除">🗑</button>
  <button id="menuBtn" aria-label="選單">⋯</button>
</header>
<div id="menu" hidden="">
  <button id="mImg">🖼 換圖片</button>
  <button id="mExp">💾 匯出 HTML（存到電腦）</button>
  <label><input type="checkbox" id="cKK" checked=""> 顯示 KK 音標</label>
  <label><input type="checkbox" id="cZh" checked=""> 顯示中文</label>
  <button id="mRef">🔄 重新套用 KK／中文／真人音檔</button>
  <button id="mClr">🗑 清空單字</button>
</div>
<input type="file" id="file" accept="image/*" hidden="">
<main id="wrap"><div id="stage" data-dyn="" style="width: 404.229px; height: 720px;"></div></main>
<div id="info" hidden="" data-dyn=""></div>
<footer>
  <div id="selbar"><button data-a="say">🔊</button><button data-a="sm">A−</button><button data-a="lg">A+</button><button data-a="zh">✎</button><button data-a="del">🗑</button></div>
  <div id="dockRow"><button id="addBtn">＋ 查單字</button><div id="chips" data-dyn=""></div></div>
</footer>
<div id="bd"></div>
<section id="sheet"><div class="grab"></div><button id="sx" aria-label="關閉">✕</button>

  <div id="result" data-dyn=""></div>
</section>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emb=JSON.parse($('#pdata').textContent);
let P=emb||(()=>{try{return JSON.parse(localStorage.getItem('ctxvocab'))}catch(e){}})()||{name:'動物園',img:null,ratio:1.2,words:[]};
P.id=P.id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
let mode=emb?'learn':'edit',sel=null,cur=null,drag=null;
const save=()=>{try{localStorage.setItem('ctxvocab',JSON.stringify(P))}catch(e){toast('儲存空間不足，請用「匯出」備份')}};
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
const W=id=>P.words.find(w=>w.id==id);
function setBody(){document.body.className='m-'+mode+(sel?' sel':'')+(P.nokk?' nokk':'')+(P.nozh?' nozh':'')+(document.body.classList.contains('sheet')?' sheet':'')}
function layout(){const r=$('#wrap').getBoundingClientRect(),ar=P.ratio||1.2;let w=r.width-20,h=w/ar;if(h>r.height){h=r.height;w=h*ar}$('#stage').style.cssText=`width:${w}px;height:${h}px`}
function render(){
  layout();
  $('#stage').innerHTML=(P.img?`<img src="${P.img}">`:'<div class="demo">還沒有圖片<br>點右上角「⋯」→「換圖片」</div>')+P.words.map(w=>`<button class="tag${w.id==sel?' sel':''}" data-id="${w.id}" style="left:${w.x}%;top:${w.y}%;--s:${(w.s*(P.scale||1)).toFixed(2)}"><b>${esc(w.word)}</b><i class="kk">${esc(w.kk)}</i><i class="zh">${esc(w.zh)}</i></button>`).join('');
  $('#chips').innerHTML=P.words.map(w=>`<button class="chip" data-id="${w.id}">${esc(w.word)}</button>`).join('')||'<span class="hint">查單字後放到圖片上</span>';
  $('#pname').value=P.name;$('#cKK').checked=!P.nokk;$('#cZh').checked=!P.nozh;setBody();
}
/* 發音：優先真人音檔，失敗則用 iPhone 內建語音 */
function tts(t,a){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=a=='uk'?'en-GB':'en-US';u.rate=.85;speechSynthesis.speak(u)}
function say(w,a='us'){const url=a=='uk'?w.auk:w.aus;const fb=why=>{toast('⚠ '+why+'，改用電腦語音');tts(w.word,a)};if(!url)return fb('沒有真人音檔');const au=new Audio(url);au.onerror=()=>fb('真人音檔播放失敗');au.play().catch(()=>fb('真人音檔播放失敗'))}
/* 美式 IPA → KK（規則轉換，僅供參考） */
const toKK=s=>s?'['+s.replace(/[\/\[\]\.]/g,'').replace(/ɜː?ɹ?|ɝ/g,'ɝ').replace(/oʊ|əʊ/g,'o').replace(/eɪ/g,'e').replace(/ɹ/g,'r').replace(/ɾ/g,'t').replace(/ɡ/g,'g').replace(/ɒ/g,'ɑ').replace(/[ːʔ]/g,'')+']':'';
async function lookup(q){
  const w={word:q,defs:[],ex:'',pos:'',zh:'',kk:'',ipaUk:''};
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));
  if(r.ok){const d=await r.json();let us,uk,any='';
    d.forEach(e=>{(e.phonetics||[]).forEach(p=>{const a=p.audio||'';if(/-us\./.test(a))us=us||{t:p.text,a};else if(/-uk\./.test(a))uk=uk||{t:p.text,a};else if(p.text)any=any||p.text});
      (e.meanings||[]).forEach(m=>{w.pos=w.pos||m.partOfSpeech;m.definitions.slice(0,2).forEach(df=>{w.defs.push(m.partOfSpeech+'. '+df.definition);if(!w.ex&&df.example)w.ex=df.example})})});
    w.kk=toKK((us&&us.t)||d[0].phonetic||any);w.aus=us&&us.a;w.auk=uk&&uk.a;w.ipaUk=uk&&uk.t?uk.t:'';w.found=1}
  try{const t=await(await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|zh-TW')).json();w.zh=t.responseData.translatedText||''}catch(e){}
  return w}
function card(w){cur=w;$('#result').innerHTML=`
<div class="wd"><h2>${esc(w.word)}</h2><span class="hint">${esc(w.pos)}</span><span class="hint">${w.aus?'🎙 真人':'⚠ 無真人音檔'}${esc(w.usNote||'')}</span></div>
<div class="ph"><button data-say="us">🔊 美式<b>${esc(w.kk||'（無音標）')}</b></button><button data-say="uk">🔊 英式<b>${esc(w.ipaUk?'/'+w.ipaUk.replace(/\//g,'')+'/':'（無）')}</b></button></div>
<label class="f">中文（可修改，或點下面的候選）<input id="zh" value="${esc(w.zh)}"></label>
<div class="zc">${(w.zhList||[]).map(z=>`<button class="chip" data-z="${esc(z)}">${esc(z)}</button>`).join('')}</div>
<div class="tabs"><button class="on" data-t="0">意思</button><button data-t="1">例句</button></div>
<div id="t0">${w.defs.map(d=>`<p>${esc(d)}</p>`).join('')||'<p class="hint">查不到英文字義，仍可加入圖片</p>'}</div>
<div id="t1" hidden><textarea id="ex" rows="3" placeholder="例句（可自己寫）">${esc(w.ex)}</textarea></div>
<button class="go" id="place">放到圖片上</button>`}
const openSheet=()=>{document.body.classList.add('sheet');layout();setTimeout(()=>$('#q').focus(),300)};
const closeSheet=()=>{document.body.classList.remove('sheet');$('#q').blur();layout()};
function info(w){$('#info').hidden=false;$('#info').innerHTML=`<button class="x" data-x>✕</button><h3>${esc(w.word)} <small>${esc(w.zh)}</small></h3><div class="hint">${esc(w.kk)}</div>${w.ex?`<p>${esc(w.ex)}</p>`:''}<div class="r"><button data-i="us">🔊 美式</button><button data-i="uk">🔊 英式</button></div>`;$('#info').dataset.id=w.id}
/* 事件 */
$('#sf').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim().toLowerCase();if(!q)return;$('#result').innerHTML='<p class="hint">查詢中…</p>';$('#q').blur();
  try{const w=await lookup(q);card(w);if(!w.found)toast('字典沒有這個字，可手動輸入中文')}catch(err){$('#result').innerHTML='<p>連不上網路，無法查字。</p>'}};
$('#result').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.say)say(cur,b.dataset.say);if(b.dataset.z)$('#zh').value=b.dataset.z;
  if(b.dataset.t){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$('#t0').hidden=b.dataset.t!='0';$('#t1').hidden=b.dataset.t!='1'}
  if(b.id=='place'){cur.zh=$('#zh').value.trim();cur.ex=$('#ex').value.trim();const w={...cur,id:Date.now(),x:50,y:50,s:4.2};P.words.push(w);sel=w.id;save();render();if(innerWidth<760)closeSheet();else{$('#result').innerHTML='';$('#q').value='';$('#q').focus()}toast('拖曳單字到想放的位置')}};
$('#addBtn').onclick=()=>{$('#q').value='';$('#result').innerHTML='';openSheet()};
$('#bd').onclick=closeSheet;$('#sx').onclick=closeSheet;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;sel=null;$('#info').hidden=true;render()});
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(c){sel=+c.dataset.id;render();say(W(sel))}};
$('#stage').addEventListener('pointerdown',e=>{if(mode!='edit')return;const t=e.target.closest('.tag');if(!t){if(sel){sel=null;render()}return}
  sel=+t.dataset.id;document.querySelectorAll('.tag').forEach(x=>x.classList.toggle('sel',x==t));setBody();t.setPointerCapture(e.pointerId);drag=t;e.preventDefault()});
$('#stage').addEventListener('pointermove',e=>{if(!drag)return;const r=$('#stage').getBoundingClientRect(),w=W(drag.dataset.id),c=v=>Math.max(2,Math.min(98,v));
  w.x=+c((e.clientX-r.left)/r.width*100).toFixed(2);w.y=+c((e.clientY-r.top)/r.height*100).toFixed(2);drag.style.left=w.x+'%';drag.style.top=w.y+'%'});
$('#stage').addEventListener('pointerup',()=>{if(drag){drag=null;save()}});
$('#stage').addEventListener('click',e=>{const t=e.target.closest('.tag');if(!t||mode!='learn')return;const w=W(t.dataset.id);t.classList.remove('pulse');void t.offsetWidth;t.classList.add('pulse');say(w)});
$('#info').onclick=e=>{const b=e.target.closest('button');if(!b)return;if('x'in b.dataset)e.currentTarget.hidden=true;if(b.dataset.i)say(W($('#info').dataset.id),b.dataset.i)};
$('#selbar').onclick=e=>{const b=e.target.closest('button'),w=W(sel);if(!b||!w)return;const a=b.dataset.a;
  if(a=='say')say(w);if(a=='sm'||a=='lg'){P.scale=Math.min(2.5,Math.max(.5,+((P.scale||1)*(a=='lg'?1.1:1/1.1)).toFixed(2)));toast('全部單字大小 '+Math.round(P.scale*100)+'%')}
  if(a=='zh'){const v=prompt('中文',w.zh);if(v!==null)w.zh=v.trim()}
  if(a=='del'&&confirm('刪除 '+w.word+'？')){P.words=P.words.filter(x=>x.id!=sel);sel=null}
  save();render()};
$('#menuBtn').onclick=()=>$('#menu').hidden=!$('#menu').hidden;
$('#mImg').onclick=()=>{$('#menu').hidden=true;$('#file').click()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);P.img=c.toDataURL('image/jpeg',.82);P.ratio=c.width/c.height;save();render()};im.src=URL.createObjectURL(f)};
$('#cKK').onchange=e=>{P.nokk=!e.target.checked;save();setBody()};
$('#cZh').onchange=e=>{P.nozh=!e.target.checked;save();setBody()};
$('#pname').onchange=e=>{P.name=e.target.value;save()};
$('#clrAll').onclick=()=>{if(!confirm('一鍵全清除？\n圖片與所有單字都會被清空，無法復原。'))return;P.words=[];P.img=null;P.ratio=1.2;sel=null;$('#info').hidden=true;P.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const n=prompt('新專案名稱（也是匯出的檔名）','');P.name=(n||'').trim()||'未命名-'+new Date().toISOString().slice(5,16).replace(/[-:T]/g,'');save();render();toast('已全部清除，現在是新專案「'+P.name+'」')};
$('#mClr').onclick=()=>{$('#menu').hidden=true;if(confirm('清空所有單字？')){P.words=[];sel=null;save();render()}};
$('#mExp').onclick=async()=>{$('#menu').hidden=true;
  const c=document.documentElement.cloneNode(true);c.querySelectorAll('[data-dyn]').forEach(e=>e.innerHTML='');c.querySelector('body').className='';
  c.querySelector('#pdata').textContent=JSON.stringify(P).replace(/</g,'\\u003c');
  const f=new File(['<!DOCTYPE html>\n'+c.outerHTML],(P.name||'單字圖')+'.html',{type:'text/html'});
  if(window.afterExport)return afterExport(f);
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()};
if(emb&&/^https?:/.test(location.protocol)&&!/(\/|index\.html)$/.test(location.pathname))$('#home').hidden=false;
addEventListener('resize',layout);
render();
</script>
<script>
/* 由 learning_server.py 注入：改用電腦上的 Wiktionary 資料庫，支援中文查詢 */
window.afterExport=async f=>{try{const r=await(await fetch('/api/save?n='+encodeURIComponent(f.name)+'&id='+encodeURIComponent(P.id||''),{method:'POST',body:f})).json();
 toast(r.renamed?'⚠ 已有同名的另一個專案，已另存為「'+r.saved+'」，沒有覆蓋舊的':'已匯出：'+r.saved+'（'+"C:\\wiktionary_audio\\exports"+'）')}catch(e){toast('匯出失敗：伺服器沒有回應')}};
$('#sf').onsubmit=async e=>{e.preventDefault();const q=$('#q').value.trim().toLowerCase();if(!q)return;
 if(cur&&cur.word===q&&$('#place')){$('#place').click();return}   // 第二次 Enter：加入圖片
 if(innerWidth<760)$('#q').blur();   // 電腦上保留游標，才能再按一次 Enter
 $('#result').innerHTML='<p class="hint">查詢中…</p>';
 try{const d=await(await fetch('/api/lookup?w='+encodeURIComponent(q))).json();
  if(d.candidates){$('#result').innerHTML=d.candidates.length?'<p class="hint">點選要查的英文字</p><div style="display:flex;flex-wrap:wrap;gap:8px">'+d.candidates.map(c=>`<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'</div>':'<p>找不到對應的英文字，請改用英文查詢。</p>';return}
  card(d);if(!d.found)toast('字典沒有這個字，可手動輸入中文')}catch(err){$('#result').innerHTML='<p>伺服器沒有回應。</p>'}};
$('#result').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){$('#q').value=b.dataset.c;if(innerWidth>=760)$('#q').focus();$('#sf').onsubmit(new Event('submit'))}});
$('#mRef').onclick=async()=>{$('#menu').hidden=true;toast('更新中…');
 for(const w of P.words){try{const d=await(await fetch('/api/lookup?w='+encodeURIComponent(w.word))).json();
  if(d.kk)w.kk=d.kk;w.aus=d.aus||null;w.auk=d.auk||null;if(d.zh&&(!w.zh||/[A-Za-zЀ-ӿ/、]/.test(w.zh)))w.zh=d.zh}catch(e){}}
 save();render();toast('已更新')};
{const orig=$('#mExp').onclick;
$('#mExp').onclick=async()=>{const old=P;
 try{P=await(await fetch('/api/embed',{method:'POST',body:JSON.stringify(P)})).json();await orig()}finally{P=old}}}
</script>
</body></html>
